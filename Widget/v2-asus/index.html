<body>
    <div class="widget-root">
        <div class="background-layer" id="background-layer" aria-hidden="true"></div>
        <div class="glass-layer" aria-hidden="true"></div>

        <div id="warn-banner" aria-live="polite"></div>

        <div class="content-area">
            <section class="view-panel" id="view-pins"></section>
            <section class="view-panel" id="view-status"></section>
            <section class="state-panel" id="state-panel"></section>
        </div>

        <div id="config-overlay" aria-hidden="true">
            <div class="cfg-header">
                <span class="cfg-title">Configuration</span>
                <div class="cfg-header-actions">
                    <button class="cfg-icon-btn cfg-refresh-btn" id="cfg-refresh-btn" aria-label="Refresh">↻</button>
                    <button class="cfg-icon-btn cfg-confirm-btn" id="cfg-confirm-btn" aria-label="Apply and close">✓</button>
                    <button class="cfg-icon-btn cfg-cancel-btn" id="cfg-cancel-btn" aria-label="Cancel">✕</button>
                </div>
            </div>
            <div class="cfg-content" id="cfg-content"></div>
        </div>

    </div>

    <script>
        const BASE_URL = 'http://localhost:59274';

        const PIN_NAMES = ['Pin 1', 'Pin 2', 'Pin 3', 'Pin 4', 'Pin 5', 'Pin 6'];

        const NAMED_SENSOR_FIELDS = {
            'Total Power': 'totalPowerW',
            'Total Current': 'totalCurrentA',
            'GPU Core Clock': 'gpuCoreClock',
            'GPU Memory Clock': 'gpuMemClock',
            'GPU Core Temp': 'gpuCoreTemp',
            'VRAM Temp': 'vramTemp',
            'Fan 1 Speed': 'fan1',
            'Fan 2 Speed': 'fan2',
            'GPU Usage': 'gpuUsage',
            'GPU Power Draw': 'gpuPowerDraw',
            'VRAM Usage': 'vramUsage',
            'VRAM Used': 'vramUsed',
            'VRAM Free': 'vramFree',
            'VRAM Total': 'vramTotal'
        };

        function normalizeSensors(payload) {
            if (!payload || !Array.isArray(payload.sensors)) return null;

            const pins = [
                { voltage: 0, current: 0, power: 0 },
                { voltage: 0, current: 0, power: 0 },
                { voltage: 0, current: 0, power: 0 },
                { voltage: 0, current: 0, power: 0 },
                { voltage: 0, current: 0, power: 0 },
                { voltage: 0, current: 0, power: 0 }
            ];

            const out = {
                pins: pins,
                totalPowerW: null, totalCurrentA: null,
                gpuCoreClock: null, gpuMemClock: null, gpuCoreTemp: null, vramTemp: null,
                fan1: null, fan2: null, gpuUsage: null, gpuPowerDraw: null,
                vramUsage: null, vramUsed: null, vramFree: null, vramTotal: null,
                currentImbalance: payload.currentImbalance || null,
                wireOvercurrent: payload.wireOvercurrent || null,
                timestamp: payload.timestamp || null
            };

            const sensors = payload.sensors;
            for (let i = 0; i < sensors.length; i++) {
                const s = sensors[i];
                if (!s || typeof s.sensorName !== 'string') continue;
                const name = s.sensorName;
                const idx = PIN_NAMES.indexOf(name);
                if (idx !== -1) {
                    const type = s.sensorType;
                    if (type === 'Voltage') pins[idx].voltage = Number(s.value);
                    else if (type === 'Current') pins[idx].current = Number(s.value);
                    else if (type === 'Power') pins[idx].power = Number(s.value);
                    continue;
                }
                const field = NAMED_SENSOR_FIELDS[name];
                if (field) out[field] = Number(s.value);
            }

            return out;
        }

        const DEBUG_DATA = {
            pins: [
                { voltage: 11.98, current: 3.42, power: 40.97 },
                { voltage: 12.01, current: 7.85, power: 94.19 },
                { voltage: 11.95, current: 1.23, power: 14.70 },
                { voltage: 12.03, current: 8.91, power: 107.10 },
                { voltage: 11.99, current: 5.67, power: 67.98 },
                { voltage: 12.00, current: 0.38, power: 4.56 }
            ],
            totalPowerW: 329.5,
            totalCurrentA: 27.46,
            gpuCoreClock: 2820,
            gpuMemClock: 1750,
            gpuCoreTemp: 64.5,
            vramTemp: 72.0,
            fan1: 1850,
            fan2: 1875,
            gpuUsage: 98,
            gpuPowerDraw: 412.3,
            vramUsage: 41.2,
            vramUsed: 13400,
            vramFree: 19207,
            vramTotal: 32607,
            timestamp: null
        };

        const DEBUG_OVERCURRENT = { pinValues: { 'Pin 3': 9.6, 'Pin 4': 9.8 } };
        const DEBUG_IMBALANCE = {
            maxPinAmperage: 9.2,
            maxPinName: 'Pin 3',
            minPinAmperage: 5.4,
            minPinName: 'Pin 6',
            percentageDifference: 52,
            timestamp: '2026-06-06T12:00:00+00:00'
        };

        let currentView = 'pins';
        let lastAppliedPollMs = -1;
        let fallbackPollMs = 1000;
        let ws = null;
        let wsReconnectTimer = null;
        let wsBackoffMs = 1000;
        let state = 'loading';
        let stateMessage = 'Loading';
        let latestData = null;
        let latestTimestamp = null;
        let cachedViewPanels = null;
        let cachedBgLayer = null;
        let serviceRestarting = false;
        let lastStyleKey = '';
        let serviceConfig = null;
        let serviceConfigLoaded = false;
        let configDraft = null;
        let configPageOpen = false;
        let peakHoldPerPin = [0, 0, 0, 0, 0, 0];
        let peakHoldMetric = '';
        let pinsSettingsDirty = true;
        let statusSettingsDirty = true;

        const SERVICE_CONFIG_DEFAULTS = {
            imbalanceAmperageThreshold: 6,
            imbalancePercentageThreshold: 30,
            imbalanceDurationThresholdMs: 3000,
            wireOvercurrentAmperageThreshold: 9.2,
            wireOvercurrentThresholdMs: 3000
        };

        const SERVICE_CONFIG_FIELDS = [
            { key: 'imbalanceAmperageThreshold', label: 'Minimum current threshold', min: 1, max: 10, step: 1, unit: 'A', float: false },
            { key: 'imbalancePercentageThreshold', label: 'Max imbalance percentage', min: 10, max: 50, step: 1, unit: '%', float: false },
            { key: 'imbalanceDurationThresholdMs', label: 'Imbalance duration to warn', step: 100, unit: 'ms', float: false, dynamic: true },
            { key: 'wireOvercurrentAmperageThreshold', label: 'Max per-pin current', min: 6, max: 10.5, step: 0.1, unit: 'A', float: true },
            { key: 'wireOvercurrentThresholdMs', label: 'Overcurrent duration to warn', step: 100, unit: 'ms', float: false, dynamic: true }
        ];

        function getConfigFieldRange(field) {
            if (field.dynamic) {
                const poll = getConfiguredPollMs();
                return { min: poll, max: Math.max(poll, 10000), step: field.step };
            }
            return { min: field.min, max: field.max, step: field.step };
        }

        function clampConfigField(field, value) {
            const range = getConfigFieldRange(field);
            let v = Number(value);
            if (!Number.isFinite(v)) v = SERVICE_CONFIG_DEFAULTS[field.key];
            v = Math.max(range.min, Math.min(range.max, v));
            return field.float ? v : Math.round(v);
        }

        function resetPeakHold() {
            peakHoldPerPin = [0, 0, 0, 0, 0, 0];
        }

        function setTextIf(el, s) {
            if (el && el.textContent !== s) el.textContent = s;
        }

        icueEvents = {
            onDataUpdated: onIcueDataUpdated,
            onICUEInitialized: onIcueInitialized
        };

        const icuePropCache = new Map();

        function invalidatePropCache() {
            icuePropCache.clear();
        }

        function resolveIcueProperty(name) {
            if (typeof window !== 'undefined' && Object.prototype.hasOwnProperty.call(window, name)) {
                const value = window[name];
                if (value !== undefined && value !== null && value !== '') return value;
            }
            try {
                const value = Function('return typeof ' + name + ' !== "undefined" ? ' + name + ' : undefined')();
                if (value !== undefined && value !== null && value !== '') return value;
            } catch (e) { }
            return undefined;
        }

        function getIcueProperty(name) {
            if (icuePropCache.has(name)) return icuePropCache.get(name);
            const value = resolveIcueProperty(name);
            icuePropCache.set(name, value);
            return value;
        }

        function clampRange(v, min, max, d) {
            const n = Number(v);
            if (!Number.isFinite(n)) return d;
            return Math.max(min, Math.min(max, n));
        }

        function getBoolProperty(name, fallback) {
            const value = getIcueProperty(name);
            if (typeof value === 'boolean') return value;
            if (value === 'true') return true;
            if (value === 'false') return false;
            return fallback;
        }

        function getConfiguredPollMs() {
            const fromSetting = clampRange(getIcueProperty('pollIntervalSec'), 100, 30000, NaN);
            if (Number.isFinite(fromSetting)) return Math.round(fromSetting);
            return fallbackPollMs;
        }

        function toFahrenheit(c) {
            return c * 9 / 5 + 32;
        }

        function formatTemp(celsiusValue) {
            const unit = getIcueProperty('tempUnit') === 'f' ? 'f' : 'c';
            const raw = Number(celsiusValue);
            const shown = unit === 'f' ? toFahrenheit(raw) : raw;
            const label = unit === 'f' ? 'F' : 'C';
            return {
                unit: unit,
                value: shown,
                text: Number.isFinite(shown) ? shown.toFixed(1) + ' ' + label : '--'
            };
        }

        function setState(nextState, message) {
            state = nextState;
            stateMessage = message || '';
            renderAll();
        }

        const FONT_FAMILY_FALLBACKS = {
            'Consolas': '"Consolas","Cascadia Mono","Courier New",monospace',
            'Cascadia Mono': '"Cascadia Mono","Consolas","Courier New",monospace',
            'JetBrains Mono': '"JetBrains Mono","Consolas","Courier New",monospace',
            'Courier New': '"Courier New","Consolas",monospace',
            'Segoe UI': '"Segoe UI","Tahoma",sans-serif'
        };

        function resolveFontStack(value, fallbackKey) {
            var key = (typeof value === 'string' && FONT_FAMILY_FALLBACKS[value]) ? value : fallbackKey;
            return FONT_FAMILY_FALLBACKS[key];
        }

        function applyStyles() {
            const rawText = getIcueProperty('textColor');
            const rawAccent = getIcueProperty('accentColor');
            const rawBg = getIcueProperty('backgroundColor');
            const textColor = typeof rawText === 'string' ? rawText : '#e7edf5';
            const accentColor = typeof rawAccent === 'string' ? rawAccent : '#00e3b6';
            const backgroundColor = typeof rawBg === 'string' ? rawBg : '#070b12';
            const transparency = clampRange(getIcueProperty('transparency'), 0, 100, 100) / 100;
            const brightness = clampRange(getIcueProperty('bgBrightness'), 20, 150, 100) / 100;
            const blur = clampRange(getIcueProperty('glassBlur'), 0, 30, 0);
            const cfgFontScale = clampRange(getIcueProperty('configFontSize'), 50, 200, 130) / 100;
            const fontData = resolveFontStack(getIcueProperty('fontData'), 'Consolas');
            const fontLabel = resolveFontStack(getIcueProperty('fontLabel'), 'Consolas');
            const hudScanlines = getBoolProperty('hudScanlines', false);
            const media = getIcueProperty('backgroundMedia');
            const mediaPath = (media && typeof media === 'object' && media.pathToAsset)
                ? String(media.pathToAsset) : '';

            const styleKey = [textColor, accentColor, backgroundColor, transparency, brightness, blur, cfgFontScale, fontData, fontLabel, hudScanlines ? 1 : 0, mediaPath].join('\x00');
            if (styleKey === lastStyleKey) return;
            lastStyleKey = styleKey;

            const root = document.documentElement;
            root.style.setProperty('--text-color', textColor);
            root.style.setProperty('--accent-color', accentColor);
            root.style.setProperty('--background-color', backgroundColor);
            root.style.setProperty('--background-opacity', String(transparency));
            root.style.setProperty('--background-brightness', String(brightness));
            root.style.setProperty('--cfg-font-scale', String(cfgFontScale));
            root.style.setProperty('--glass-blur', blur + 'px');
            root.style.setProperty('--font-data', fontData);
            root.style.setProperty('--font-label', fontLabel);
            document.documentElement.dataset.hudScanlines = hudScanlines ? '1' : '0';

            if (!cachedBgLayer) cachedBgLayer = document.getElementById('background-layer');
            if (!cachedBgLayer) return;

            if (mediaPath) {
                cachedBgLayer.style.backgroundImage = "url('" + mediaPath.replace(/'/g, "\\'") + "')";
                cachedBgLayer.style.backgroundSize = 'cover';
                cachedBgLayer.style.backgroundPosition = 'center center';
            } else {
                cachedBgLayer.style.backgroundImage = 'none';
            }
        }

        function activateView(viewName) {
            currentView = viewName;
            if (!cachedViewPanels) {
                cachedViewPanels = Array.from(document.querySelectorAll('.view-panel'));
            }
            cachedViewPanels.forEach(function (panel) {
                panel.classList.remove('active');
            });
            const activePanel = document.getElementById('view-' + viewName);
            if (activePanel) activePanel.classList.add('active');
        }

        let lastStateKey = '';

        function renderStateOverlay() {
            const panel = document.getElementById('state-panel');
            if (!panel) return;

            const key = state + '\x00' + stateMessage;
            if (key === lastStateKey) return;
            lastStateKey = key;

            if (state === 'content') {
                panel.classList.remove('active');
                panel.textContent = '';
                return;
            }

            panel.classList.add('active');
            panel.textContent = stateMessage || (state === 'loading' ? 'Loading' : 'Device unavailable');
        }

        const PIN_CURRENT_LIMIT_A = 9.2;

        function getPinHeadroomLimit(metric) {
            if (metric === 'current') return PIN_CURRENT_LIMIT_A;
            return null;
        }

        const PIN_METRICS = {
            current: {
                field: 'current', axis: [0, 2, 4, 6, 8, 10], min: 0, max: 10, unit: 'A',
                format: function (v, showUnit) { return v.toFixed(2) + (showUnit ? ' A' : ''); },
                axisFormat: function (v) { return v + 'A'; }
            },
            power: {
                field: 'power', axis: [0, 150, 300, 450, 600], min: 0, max: 600, unit: 'W',
                format: function (v, showUnit) { return v.toFixed(1) + (showUnit ? ' W' : ''); },
                axisFormat: function (v) { return v + 'W'; }
            },
            voltage: {
                field: 'voltage', axis: [11.4, 11.7, 12.0, 12.3, 12.6], min: 11.4, max: 12.6, unit: 'V',
                format: function (v, showUnit) { return v.toFixed(2) + (showUnit ? ' V' : ''); },
                axisFormat: function (v) { return v.toFixed(1) + 'V'; }
            }
        };

        const pinValuesBuf = [0, 0, 0, 0, 0, 0];

        function renderPinsView() {
            const container = document.getElementById('view-pins');
            if (!container) return;
            if (!latestData || !Array.isArray(latestData.pins)) {
                container.innerHTML = '';
                container._pinNodes = null;
                container.dataset.pinStructKey = '';
                pinsSettingsDirty = true;
                ensureHudTitle(container, 'PINS', '');
                return;
            }

            const selectedMetric = getIcueProperty('pinMetric');
            const metric = selectedMetric === 'voltage' || selectedMetric === 'power' ? selectedMetric : 'current';
            const metricCfg = PIN_METRICS[metric];
            const showUnit = getBoolProperty('pinShowUnit', false);
            const showPowerValues = getBoolProperty('pinShowPowerValues', true);
            const showPeakHold = getBoolProperty('pinShowPeakHold', true) && metric !== 'voltage';
            const showHeadroom = getBoolProperty('pinShowHeadroom', false) && metric !== 'voltage';
            const showImbalance = getBoolProperty('pinShowImbalance', false);
            const showBarBg = getBoolProperty('pinShowBarBg', false);
            const showYAxis = getBoolProperty('pinShowYAxis', true);
            const showYGrid = getBoolProperty('pinShowYGrid', false);

            if (peakHoldMetric !== metric) {
                peakHoldMetric = metric;
                peakHoldPerPin = [0, 0, 0, 0, 0, 0];
            }

            const barColor = getIcueProperty('pinBarColor') || '#8500ff';
            const peakHoldColor = getIcueProperty('pinPeakHoldColor') || '#f5d033';
            const headroomColor = getIcueProperty('pinHeadroomColor') || '#00ff47';
            const pvColor = getIcueProperty('pinPowerValuesColor') || '#ffffff';
            const imbalColor = getIcueProperty('pinColorImbalance') || '#ffffff';
            const headroomLimit = getPinHeadroomLimit(metric);
            const headroomPosition = String(getIcueProperty('pinHeadroomPosition') || 'Top').toLowerCase() === 'bottom' ? 'bottom' : 'top';

            const pins = latestData.pins;
            const n = pins.length;
            const mMin = metricCfg.min;
            const mRange = metricCfg.max - metricCfg.min;
            for (let i = 0; i < n; i++) {
                const v = Number((pins[i] && pins[i][metricCfg.field]) || 0);
                pinValuesBuf[i] = v;
                if (Number.isFinite(v) && v > peakHoldPerPin[i]) peakHoldPerPin[i] = v;
            }
            const pinValues = pinValuesBuf;

            const layoutUnit = Math.min(window.innerWidth, window.innerHeight) / 100;

            let scalePinNumbers, scaleYAxis, scalePinValues, scaleImbalance, scalePowerValues, scaleHeadroom;
            let fontPinLabel, fontYTick, fontPinVal, fontPowerValues, fontHeadroom, pinBottomSpacePx, pinTopSpacePx;
            let structKey, needRebuild;

            if (pinsSettingsDirty || !container._pinNodes || layoutUnit !== container._pinLayoutUnit) {
                scalePinNumbers = clampRange(getIcueProperty('pinFontPinNumbers'), 70, 150, 115) / 100;
                scaleYAxis = clampRange(getIcueProperty('pinFontYAxis'), 70, 150, 115) / 100;
                scalePinValues = clampRange(getIcueProperty('pinFontValues'), 70, 150, 120) / 100;
                scaleImbalance = clampRange(getIcueProperty('pinFontImbalance'), 70, 150, 115) / 100;
                scalePowerValues = clampRange(getIcueProperty('pinPowerFontSize'), 70, 150, 115) / 100;
                scaleHeadroom = clampRange(getIcueProperty('pinHeadroomFontSize'), 70, 150, 130) / 100;
                fontPinLabel = Math.max(9, layoutUnit * 2.7) * scalePinNumbers;
                fontYTick = Math.max(10, layoutUnit * 2.7) * scaleYAxis;
                fontPinVal = Math.max(11, layoutUnit * 3.2) * scalePinValues;
                fontPowerValues = Math.max(10, layoutUnit * 2.7) * scalePowerValues;
                fontHeadroom = Math.max(9, layoutUnit * 2.5) * scaleHeadroom;
                pinBottomSpacePx = layoutUnit * 2.6 * scalePinNumbers;
                pinTopSpacePx = layoutUnit * 3.6 * scalePinValues;

                structKey = [
                    metric, n,
                    showYAxis ? 1 : 0, showBarBg ? 1 : 0, showYGrid ? 1 : 0,
                    showUnit ? 1 : 0, showImbalance ? 1 : 0,
                    showPowerValues ? 1 : 0, showPeakHold ? 1 : 0,
                    showHeadroom ? 1 : 0, headroomPosition,
                    scalePinNumbers.toFixed(3), scaleYAxis.toFixed(3),
                    scalePinValues.toFixed(3), scaleImbalance.toFixed(3),
                    scalePowerValues.toFixed(3), scaleHeadroom.toFixed(3)
                ].join(',');

                needRebuild = !container._pinNodes || container.dataset.pinStructKey !== structKey || layoutUnit !== container._pinLayoutUnit;
                pinsSettingsDirty = false;
            } else {
                needRebuild = false;
            }

            if (!needRebuild) {
                const nodes = container._pinNodes;
                const fills = nodes.fills, peaks = nodes.peaks, vals = nodes.vals;
                for (let i = 0; i < n; i++) {
                    const v = pinValues[i];
                    const fill = fills[i];
                    if (fill) {
                        const pct = Math.max(0, Math.min(100, ((v - mMin) / mRange) * 100));
                        if (fill._pct !== pct) { fill._pct = pct; fill.style.height = pct.toFixed(1) + '%'; }
                        fill.style.background = barColor;
                    }
                    const val = vals[i];
                    if (val && val._v !== v) { val._v = v; setTextIf(val, metricCfg.format(v, showUnit)); }
                    const peak = peaks[i];
                    if (peak) {
                        const pk = peakHoldPerPin[i];
                        if (peak._pv !== pk) {
                            peak._pv = pk;
                            const peakPct = Math.max(0, Math.min(100, ((pk - mMin) / mRange) * 100));
                            peak.style.bottom = peakPct.toFixed(1) + '%';
                        }
                        peak.style.color = peakHoldColor;
                    }
                }

                if (showHeadroom && headroomLimit !== null) {
                    const cells = nodes.headroom;
                    for (let i = 0; i < n; i++) {
                        const cell = cells[i];
                        if (!cell) continue;
                        const headroom = headroomLimit - pinValues[i];
                        const low = headroom <= 0;
                        setTextIf(cell, (headroom >= 0 ? '+' : '') + headroom.toFixed(metric === 'current' ? 2 : 1) + metricCfg.unit);
                        cell.classList.toggle('low', low);
                        cell.style.color = low ? '' : headroomColor;
                    }
                }

                if (showPowerValues && nodes.pwrVal) {
                    const pw = Number(latestData.totalPowerW || 0);
                    const am = Number(latestData.totalCurrentA || 0);
                    const vl = am > 0 ? pw / am : 0;
                    nodes.pwrChip.style.color = pvColor;
                    nodes.ampChip.style.color = pvColor;
                    nodes.vltChip.style.color = pvColor;
                    setTextIf(nodes.pwrVal, Math.round(pw) + ' W');
                    setTextIf(nodes.ampVal, Math.round(am) + ' A');
                    setTextIf(nodes.vltVal, vl.toFixed(2) + ' V');
                }

                if (showImbalance && n > 0 && nodes.miVal) {
                    let minVal = Infinity, maxVal = -Infinity, minIdx = 0, maxIdx = 0;
                    for (let i = 0; i < n; i++) {
                        const v = pinValues[i];
                        if (v < minVal) { minVal = v; minIdx = i; }
                        if (v > maxVal) { maxVal = v; maxIdx = i; }
                    }
                    nodes.miChip.style.color = imbalColor;
                    setTextIf(nodes.miVal, 'P' + (minIdx + 1) + ' → P' + (maxIdx + 1) + ' ' + metricCfg.format(maxVal - minVal, showUnit));
                }
                return;
            }

            container.innerHTML = '';
            container.dataset.pinStructKey = structKey;

            const nodes = { fills: [], peaks: [], vals: [], headroom: [], pwrChip: null, pwrVal: null, ampChip: null, ampVal: null, vltChip: null, vltVal: null, miChip: null, miVal: null };

            ensureHudTitle(container, 'PINS', metric.toUpperCase());

            if (showPowerValues || showImbalance) {
                const strip = document.createElement('div');
                strip.className = 'pin-board-temps';
                strip.style.fontSize = fontPowerValues + 'px';

                if (showPowerValues) {
                    const pw = Number(latestData.totalPowerW || 0);
                    const am = Number(latestData.totalCurrentA || 0);
                    const vl = am > 0 ? pw / am : 0;
                    const pwrChip = makeBoardChip('pwr', 'PWR', Math.round(pw) + ' W', pvColor);
                    const ampChip = makeBoardChip('amp', 'AMP', Math.round(am) + ' A', pvColor);
                    const vltChip = makeBoardChip('vlt', 'VLT', vl.toFixed(2) + ' V', pvColor);
                    nodes.pwrChip = pwrChip; nodes.pwrVal = pwrChip.querySelector('.pbt-val');
                    nodes.ampChip = ampChip; nodes.ampVal = ampChip.querySelector('.pbt-val');
                    nodes.vltChip = vltChip; nodes.vltVal = vltChip.querySelector('.pbt-val');
                    strip.appendChild(pwrChip);
                    strip.appendChild(ampChip);
                    strip.appendChild(vltChip);
                }

                if (showImbalance && n > 0) {
                    let minVal = Infinity, maxVal = -Infinity, minIdx = 0, maxIdx = 0;
                    for (let i = 0; i < n; i++) {
                        const v = pinValues[i];
                        if (v < minVal) { minVal = v; minIdx = i; }
                        if (v > maxVal) { maxVal = v; maxIdx = i; }
                    }
                    const miText = 'P' + (minIdx + 1) + ' → P' + (maxIdx + 1) + ' ' + metricCfg.format(maxVal - minVal, showUnit);
                    const miChip = makeBoardChip('mi', 'MI', miText, imbalColor);
                    nodes.miChip = miChip; nodes.miVal = miChip.querySelector('.pbt-val');
                    strip.appendChild(miChip);
                }

                container.appendChild(strip);
            }

            const chartWrap = document.createElement('div');
            chartWrap.className = 'pins-chart-wrap' + (showYAxis ? '' : ' no-axis');
            chartWrap.style.setProperty('--pin-top-space', pinTopSpacePx + 'px');
            chartWrap.style.setProperty('--pin-bottom-space', pinBottomSpacePx + 'px');

            if (showYAxis) {
                const axis = document.createElement('div');
                axis.className = 'y-axis';
                const ax = metricCfg.axis;
                for (let i = ax.length - 1; i >= 0; i--) {
                    const tick = document.createElement('div');
                    tick.className = 'y-tick';
                    tick.style.fontSize = fontYTick + 'px';
                    tick.textContent = metricCfg.axisFormat(ax[i]);
                    axis.appendChild(tick);
                }
                chartWrap.appendChild(axis);
            }

            const chart = document.createElement('div');
            chart.className = 'pins-chart';

            for (let index = 0; index < n; index++) {
                const v = pinValues[index];
                const pct = Math.max(0, Math.min(100, ((v - mMin) / mRange) * 100));

                const col = document.createElement('div');
                col.className = 'pin-col';

                const lbl = document.createElement('div');
                lbl.className = 'pin-label';
                lbl.style.fontSize = fontPinLabel + 'px';
                lbl.textContent = 'P' + (index + 1);
                col.appendChild(lbl);

                const track = document.createElement('div');
                track.className = showBarBg ? 'pin-track' : 'pin-track no-track-bg';
                const fill = document.createElement('div');
                fill.className = 'bar-fill pin-bar-fill';
                fill.dataset.targetPct = pct.toFixed(1);
                fill.style.height = '0%';
                fill.style.background = barColor;
                fill._pct = 0;
                track.appendChild(fill);
                nodes.fills.push(fill);

                if (showPeakHold) {
                    const pk = peakHoldPerPin[index];
                    const peakPct = Math.max(0, Math.min(100, ((pk - mMin) / mRange) * 100));
                    const peak = document.createElement('div');
                    peak.className = 'pin-peak-mark';
                    peak.style.bottom = peakPct.toFixed(1) + '%';
                    peak.style.color = peakHoldColor;
                    peak._pv = pk;
                    track.appendChild(peak);
                    nodes.peaks.push(peak);
                } else {
                    nodes.peaks.push(null);
                }

                col.appendChild(track);

                const val = document.createElement('div');
                val.className = 'pin-val';
                val.style.fontSize = fontPinVal + 'px';
                val.textContent = metricCfg.format(v, showUnit);
                val._v = v;
                col.appendChild(val);
                nodes.vals.push(val);

                chart.appendChild(col);
            }

            if (showYGrid) {
                const gridOverlay = document.createElement('div');
                gridOverlay.className = 'pins-grid-overlay';
                metricCfg.axis.forEach(function (tickValue) {
                    const norm = Math.max(0, Math.min(1, (tickValue - mMin) / mRange));
                    const a = (1 - norm).toFixed(4);
                    const b = (1 - 3 * norm).toFixed(4);
                    const c = (-norm).toFixed(4);
                    const d = (norm * 100).toFixed(2);
                    const gridLine = document.createElement('div');
                    gridLine.className = 'pin-grid-line';
                    gridLine.style.bottom = 'calc(' + a + ' * var(--pin-top-space) + ' + b + ' * var(--pin-slot-gap) + ' + c + ' * var(--pin-bottom-space) + ' + d + '%)';
                    gridOverlay.appendChild(gridLine);
                });
                chart.appendChild(gridOverlay);
            }

            chartWrap.appendChild(chart);
            container.appendChild(chartWrap);

            function buildHeadroomRow() {
                const hrRow = document.createElement('div');
                hrRow.className = 'pin-headroom-row position-' + headroomPosition + (showYAxis ? '' : ' no-axis');
                hrRow.style.fontSize = fontHeadroom + 'px';
                if (showYAxis) {
                    const spacer = document.createElement('div');
                    spacer.className = 'pin-headroom-spacer';
                    hrRow.appendChild(spacer);
                }
                const cells = document.createElement('div');
                cells.className = 'pin-headroom-cells';
                for (let i = 0; i < n; i++) {
                    const v = pinValues[i];
                    const cell = document.createElement('span');
                    cell.className = 'pin-headroom';
                    const headroom = headroomLimit - v;
                    cell.textContent = (headroom >= 0 ? '+' : '') + headroom.toFixed(metric === 'current' ? 2 : 1) + metricCfg.unit;
                    if (headroom <= 0) cell.classList.add('low');
                    else cell.style.color = headroomColor;
                    cells.appendChild(cell);
                    nodes.headroom.push(cell);
                }
                hrRow.appendChild(cells);
                return hrRow;
            }

            if (showHeadroom && headroomLimit !== null && headroomPosition === 'top') {
                container.insertBefore(buildHeadroomRow(), chartWrap);
            }

            if (showHeadroom && headroomLimit !== null && headroomPosition === 'bottom') {
                container.appendChild(buildHeadroomRow());
            }

            container._pinNodes = nodes;
            container._pinLayoutUnit = layoutUnit;

            requestAnimationFrame(function () {
                const fills = nodes.fills;
                for (let i = 0; i < fills.length; i++) {
                    const f = fills[i];
                    f.style.height = (f.dataset.targetPct || '0') + '%';
                    f._pct = parseFloat(f.dataset.targetPct || '0');
                }
            });
        }


        function openConfigPage() {
            configPageOpen = true;
            renderConfigPage();
            fetchServiceConfig().then(function () {
                if (configPageOpen) renderConfigPage();
            });
            const overlay = document.getElementById('config-overlay');
            if (overlay) {
                overlay.removeAttribute('aria-hidden');
                overlay.classList.add('config-overlay--open');
            }
        }

        function closeConfigPage() {
            configPageOpen = false;
            const overlay = document.getElementById('config-overlay');
            if (overlay) {
                overlay.setAttribute('aria-hidden', 'true');
                overlay.classList.remove('config-overlay--open');
            }
        }

        function formatConfigValue(field, value) {
            var v = Number(value);
            if (!Number.isFinite(v)) v = SERVICE_CONFIG_DEFAULTS[field.key];
            var text = field.float ? v.toFixed(1) : String(Math.round(v));
            return field.unit ? text + ' ' + field.unit : text;
        }

        function makeConfigSlider(field) {
            var cfg = configDraft || serviceConfig || SERVICE_CONFIG_DEFAULTS;
            var range = getConfigFieldRange(field);
            var value = clampConfigField(field, cfg[field.key]);

            var row = document.createElement('div');
            row.className = 'cfg-slider';

            var head = document.createElement('div');
            head.className = 'cfg-slider-head';
            var lbl = document.createElement('span');
            lbl.className = 'cfg-slider-label';
            lbl.textContent = field.label;
            var valEl = document.createElement('span');
            valEl.className = 'cfg-slider-value';
            valEl.textContent = formatConfigValue(field, value);
            head.appendChild(lbl);
            head.appendChild(valEl);

            var input = document.createElement('input');
            input.type = 'range';
            input.className = 'cfg-range';
            input.min = String(range.min);
            input.max = String(range.max);
            input.step = String(range.step);
            input.value = String(value);
            input.style.touchAction = 'none';
            input.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
            input.addEventListener('click', function (e) { e.stopPropagation(); });
            input.addEventListener('input', function () {
                valEl.textContent = formatConfigValue(field, input.value);
                if (!configDraft) configDraft = {};
                configDraft[field.key] = field.float ? parseFloat(input.value) : parseInt(input.value, 10);
            });

            row.appendChild(head);
            row.appendChild(input);
            return row;
        }

        function submitConfig() {
            postServiceConfig(configDraft);
        }

        function renderConfigPage() {
            var content = document.getElementById('cfg-content');
            if (!content) return;
            content.innerHTML = '';

            configDraft = Object.assign({}, serviceConfig || SERVICE_CONFIG_DEFAULTS);

            SERVICE_CONFIG_FIELDS.forEach(function (field) {
                content.appendChild(makeConfigSlider(field));
            });

            var divider = document.createElement('div');
            divider.className = 'cfg-divider';
            content.appendChild(divider);

            var resetPeakBtn = document.createElement('button');
            resetPeakBtn.id = 'reset-peakhold-btn';
            resetPeakBtn.textContent = 'Reset peak hold';
            resetPeakBtn.addEventListener('click', function () {
                resetPeakHold();
                renderAll();
            });
            content.appendChild(resetPeakBtn);

            var restartBtn = document.createElement('button');
            restartBtn.id = 'restart-service-btn';
            restartBtn.textContent = serviceRestarting ? 'Restarting…' : 'Restart service';
            restartBtn.disabled = serviceRestarting;
            restartBtn.addEventListener('click', restartService);
            content.appendChild(restartBtn);
        }

        async function restartService() {
            serviceRestarting = true;
            var btn = document.getElementById('restart-service-btn');
            if (btn) { btn.textContent = 'Restarting…'; btn.disabled = true; }
            try { await fetch(BASE_URL + '/restart', { method: 'POST' }); } catch (e) { }
        }

        function makeBoardChip(cls, label, formatted, color) {
            const chip = document.createElement('span');
            chip.className = 'pin-board-temp ' + cls;
            chip.style.color = color;
            const lbl = document.createElement('span');
            lbl.className = 'pbt-label';
            lbl.textContent = label;
            const val = document.createElement('span');
            val.className = 'pbt-val';
            val.textContent = formatted;
            chip.appendChild(lbl);
            chip.appendChild(val);
            return chip;
        }

        const STATUS_METRICS = [
            { key: 'gpuCoreClock', label: 'Core Clock', icon: 'clock', type: 'clock', showProp: 'statusShowCoreClock' },
            { key: 'gpuMemClock', label: 'Memory Clock', icon: 'memory', type: 'clock', showProp: 'statusShowMemClock' },
            { key: 'gpuCoreTemp', label: 'Core Temp', icon: 'thermometer', type: 'temp', showProp: 'statusShowCoreTemp', thresholdProp: 'statusCoreTempThreshold', thresholdDefault: 84 },
            { key: 'vramTemp', label: 'VRAM Temp', icon: 'thermometer', type: 'temp', showProp: 'statusShowVramTemp', thresholdProp: 'statusVramTempThreshold', thresholdDefault: 95 },
            { key: 'fan1', label: 'Fan 1', icon: 'fan', type: 'fan', showProp: 'statusShowFan1' },
            { key: 'fan2', label: 'Fan 2', icon: 'fan', type: 'fan', showProp: 'statusShowFan2' }
        ];

        const STATUS_ICON_FILES = {
            clock: 'vcore.svg',
            memory: 'vram.svg',
            thermometer: 'vtemp.svg',
            fan: 'vfan.svg'
        };

        function makeStatusIcon(name) {
            const file = STATUS_ICON_FILES[name] || 'vcore.svg';
            const span = document.createElement('span');
            span.className = 'status-metric-icon';
            const url = "url('resources/" + file + "')";
            span.style.webkitMaskImage = url;
            span.style.maskImage = url;
            return span;
        }

        function formatStatusValue(metric, raw) {
            if (raw === null || raw === undefined || !Number.isFinite(Number(raw))) return '--';
            const v = Number(raw);
            if (metric.type === 'clock') return Math.round(v) + ' MHz';
            if (metric.type === 'fan') return Math.round(v) + ' RPM';
            if (metric.type === 'temp') return formatTemp(v).text;
            return String(v);
        }

        function applyStatusMetricValue(metric, valueEl, defaultColor) {
            const raw = latestData ? latestData[metric.key] : null;
            setTextIf(valueEl, formatStatusValue(metric, raw));
            let hot = false;
            if (metric.type === 'temp' && Number.isFinite(Number(raw))) {
                const thresholdC = clampRange(getIcueProperty(metric.thresholdProp), 40, 120, metric.thresholdDefault);
                hot = Number(raw) >= thresholdC;
            }
            valueEl.style.color = hot ? 'var(--red)' : defaultColor;
        }

        function renderStatusView() {
            const container = document.getElementById('view-status');
            if (!container) return;
            if (!latestData) {
                container.innerHTML = '';
                container._statusNodes = null;
                container.dataset.statusStructKey = '';
                statusSettingsDirty = true;
                return;
            }

            const valueColor = getIcueProperty('statusValueColor') || '#ffffff';

            let fontScale, labelColor, iconColor, visible, structKey, needRebuild;
            if (statusSettingsDirty || !container._statusNodes) {
                fontScale = clampRange(getIcueProperty('statusFontSize'), 50, 400, 130) / 100;
                labelColor = getIcueProperty('statusLabelColor') || '';
                iconColor = getIcueProperty('statusIconColor') || '';
                visible = STATUS_METRICS.filter(function (m) { return getBoolProperty(m.showProp, true); });
                structKey = [
                    visible.map(function (m) { return m.key; }).join(':'),
                    fontScale.toFixed(3), valueColor, labelColor, iconColor
                ].join('\x00');
                needRebuild = !container._statusNodes || container.dataset.statusStructKey !== structKey;
                statusSettingsDirty = false;
            } else {
                needRebuild = false;
            }

            if (!needRebuild) {
                const nodes = container._statusNodes;
                const metrics = nodes.metrics, valueEls = nodes.valueEls;
                for (let i = 0; i < metrics.length; i++) {
                    applyStatusMetricValue(metrics[i], valueEls[i], valueColor);
                }
                return;
            }

            container.dataset.statusStructKey = structKey;

            container.innerHTML = '';
            ensureHudTitle(container, 'STATUS', '');
            container.style.setProperty('--status-scale', fontScale);

            const grid = document.createElement('div');
            grid.className = 'status-metric-grid';
            const valueEls = [];

            visible.forEach(function (m) {
                const row = document.createElement('div');
                row.className = 'status-metric-row';
                row.dataset.metric = m.key;

                const iconWrap = document.createElement('span');
                iconWrap.className = 'status-metric-icon-wrap';
                if (iconColor) iconWrap.style.color = iconColor;
                iconWrap.appendChild(makeStatusIcon(m.icon));

                const label = document.createElement('span');
                label.className = 'status-metric-label';
                label.textContent = m.label;
                if (labelColor) label.style.color = labelColor;

                const value = document.createElement('span');
                value.className = 'status-metric-value';
                applyStatusMetricValue(m, value, valueColor);

                row.appendChild(iconWrap);
                row.appendChild(label);
                row.appendChild(value);
                grid.appendChild(row);
                valueEls.push(value);
            });

            container.appendChild(grid);
            container._statusNodes = { metrics: visible, valueEls: valueEls };
        }

        function renderAllViews() {
            var panels = getActivePanels();
            renderActivePanels(panels);
        }

        function getLayoutMode() {
            var w = window.innerWidth;
            var h = window.innerHeight;
            if (w >= 2400 || h >= 2400) return 'xl';
            if (w >= 1600 || h >= 1600) return 'lg';
            return 'single';
        }

        function getActivePanels(mode) {
            if (!mode) mode = getLayoutMode();
            if (mode === 'single') return [currentView];
            var p1 = currentView;
            var p2 = getIcueProperty('layoutPanel2');
            var p2on = p2 && p2 !== 'off';
            if (!p2on) return [p1];
            return [p1, p2];
        }

        var lastActivateKey = '';

        function activatePanels(views, mode) {
            if (!mode) mode = getLayoutMode();
            var scanlinesOn = document.documentElement.dataset.hudScanlines === '1';
            var key = mode + '|' + (scanlinesOn ? 1 : 0) + '|' + views.join(',');
            if (key === lastActivateKey) return;
            lastActivateKey = key;

            document.documentElement.dataset.layout = mode;
            if (!cachedViewPanels) {
                cachedViewPanels = Array.from(document.querySelectorAll('.view-panel'));
            }
            cachedViewPanels.forEach(function (panel) {
                panel.classList.remove('active');
                panel.classList.add('hud-frame');
                panel.classList.toggle('hud-scanlines', scanlinesOn);
            });
            views.forEach(function (view) {
                var panel = document.getElementById('view-' + view);
                if (panel) panel.classList.add('active');
            });
        }

        function ensureHudTitle(container, text, sub, subClass) {
            var title = container.querySelector(':scope > .hud-title');
            if (!title) {
                title = document.createElement('div');
                title.className = 'hud-title';
                container.insertBefore(title, container.firstChild);
            }
            var subClassName = 'hud-title-sub' + (subClass ? ' ' + subClass : '');
            if (title.dataset.text !== text) {
                title.dataset.text = text;
                title.innerHTML = '';
                title.appendChild(document.createTextNode(text));
                if (sub) {
                    var s = document.createElement('span');
                    s.className = subClassName;
                    s.textContent = sub;
                    title.appendChild(s);
                }
            } else {
                var subSpan = title.querySelector('.hud-title-sub');
                if (sub) {
                    if (subSpan) {
                        subSpan.textContent = sub;
                        subSpan.className = subClassName;
                    } else {
                        var s2 = document.createElement('span');
                        s2.className = subClassName;
                        s2.textContent = sub;
                        title.appendChild(s2);
                    }
                } else if (subSpan) {
                    subSpan.remove();
                }
            }
            return title;
        }

        function renderActivePanels(views) {
            var seen = {};
            views.forEach(function (view) {
                if (seen[view]) return;
                seen[view] = true;
                if (view === 'pins') renderPinsView();
                else if (view === 'status') renderStatusView();
            });
        }

        function renderAll() {
            var mode = getLayoutMode();
            var panels = getActivePanels(mode);
            activatePanels(panels, mode);
            renderActivePanels(panels);
            renderStateOverlay();
            checkWarnings();
        }

        function formatWarnAmps(v) {
            return Number(v).toFixed(1) + 'A';
        }

        function formatLoggedOn(ts) {
            var d = new Date(ts);
            if (isNaN(d.getTime())) return String(ts || '');
            function pad(n) { return n < 10 ? '0' + n : '' + n; }
            return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }

        function buildWarnSection(parent, heading, lines) {
            var section = document.createElement('div');
            section.className = 'warn-section';
            if (heading) {
                var head = document.createElement('div');
                head.className = 'warn-subhead';
                head.textContent = heading;
                section.appendChild(head);
            }
            lines.forEach(function (text) {
                var line = document.createElement('div');
                line.className = 'warn-line';
                line.textContent = '- ' + text;
                section.appendChild(line);
            });
            parent.appendChild(section);
        }

        function checkWarnings() {
            var doWarn = getBoolProperty('warnOnFault', false);
            var imb = latestData ? latestData.currentImbalance : null;
            var oc = latestData ? latestData.wireOvercurrent : null;
            var hasImb = !!imb;
            var hasOc = !!(oc && oc.pinValues && Object.keys(oc.pinValues).length > 0);

            if (!doWarn || (!hasImb && !hasOc)) {
                hideAllWarnings();
                return;
            }

            var warnFontScale = Math.max(0.5, Math.min(2, (Number(getIcueProperty('warnFontSize')) || 100) / 100));
            var warnColor = getIcueProperty('warnColor') || '#8a0f1f';
            var warnTextColor = getIcueProperty('warnTextColor') || '#ffffff';
            var warnOpacity = Math.max(0, Math.min(100, Number(getIcueProperty('warnTransparency')) || 90)) / 100;
            var banner = document.getElementById('warn-banner');
            if (!banner) return;
            banner.style.opacity = String(warnOpacity);

            var title = (hasImb && hasOc) ? 'Current imbalance and overcurrent!'
                : hasImb ? 'Current imbalance!' : 'Wire overcurrent!';

            var sig = JSON.stringify({ imb: imb, oc: oc, c: warnColor, t: warnTextColor, f: warnFontScale });
            if (banner.dataset.warnSig === sig) {
                updateBannerVisibility();
                return;
            }
            banner.dataset.warnSig = sig;
            banner.innerHTML = '';

            var card = document.createElement('div');
            card.className = 'warn-card';
            card.style.setProperty('--warn-color', warnColor);
            card.style.setProperty('--warn-text', warnTextColor);
            card.style.fontSize = 'calc(var(--font-sm) * ' + warnFontScale + ')';

            var top = document.createElement('div');
            top.className = 'warn-card-top';
            var icon = document.createElement('span');
            icon.className = 'warn-icon';
            icon.textContent = '⚠';
            var ttl = document.createElement('span');
            ttl.className = 'warn-title';
            ttl.textContent = title;
            var dismiss = document.createElement('button');
            dismiss.className = 'warn-dismiss';
            dismiss.textContent = '✕';
            dismiss.setAttribute('aria-label', 'Dismiss');
            dismiss.addEventListener('click', function () {
                banner.innerHTML = '';
                banner.dataset.warnSig = '';
                updateBannerVisibility();
            });
            top.appendChild(icon);
            top.appendChild(ttl);
            top.appendChild(dismiss);
            card.appendChild(top);

            var both = hasImb && hasOc;

            if (hasImb) {
                var imbLines = [
                    imb.maxPinName + ' - ' + formatWarnAmps(imb.maxPinAmperage),
                    imb.minPinName + ' - ' + formatWarnAmps(imb.minPinAmperage),
                    'Difference: ' + imb.percentageDifference + '%',
                    'Logged on: ' + formatLoggedOn(imb.timestamp)
                ];
                buildWarnSection(card, both ? 'Current imbalance' : '', imbLines);
            }

            if (both) {
                var divider = document.createElement('div');
                divider.className = 'warn-divider';
                card.appendChild(divider);
            }

            if (hasOc) {
                var ocLines = Object.keys(oc.pinValues).map(function (pin) {
                    return pin + ' - ' + formatWarnAmps(oc.pinValues[pin]);
                });
                buildWarnSection(card, both ? 'Wire overcurrent' : '', ocLines);
            }

            banner.appendChild(card);
            updateBannerVisibility();
        }

        function updateBannerVisibility() {
            var banner = document.getElementById('warn-banner');
            if (!banner) return;
            var hasCards = banner.children.length > 0;
            if (hasCards) banner.classList.add('warn-banner--visible');
            else banner.classList.remove('warn-banner--visible');
        }

        function hideAllWarnings() {
            var banner = document.getElementById('warn-banner');
            if (!banner) return;
            if (banner.dataset.warnSig === '' && banner.children.length === 0) return;
            banner.innerHTML = '';
            banner.dataset.warnSig = '';
            banner.classList.remove('warn-banner--visible');
        }

        function buildConfigBody() {
            const cfg = serviceConfig || SERVICE_CONFIG_DEFAULTS;
            const body = { pollIntervalMs: getConfiguredPollMs() };
            SERVICE_CONFIG_FIELDS.forEach(function (f) {
                body[f.key] = clampConfigField(f, cfg[f.key]);
            });
            return body;
        }

        async function postServiceConfig(overrides) {
            if (!serviceConfig) serviceConfig = Object.assign({}, SERVICE_CONFIG_DEFAULTS);
            if (overrides) Object.assign(serviceConfig, overrides);
            const body = buildConfigBody();
            lastAppliedPollMs = body.pollIntervalMs;
            try {
                await fetch(BASE_URL + '/config', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
            } catch (e) {
            }
        }

        async function postPollConfigIfNeeded() {
            const nextPollMs = getConfiguredPollMs();
            if (nextPollMs === lastAppliedPollMs) return;

            if (!serviceConfigLoaded) {
                await fetchServiceConfig();
                if (!serviceConfigLoaded) return;
            }
            await postServiceConfig(null);
        }

        async function fetchServiceConfig() {
            try {
                const response = await fetch(BASE_URL + '/config', { cache: 'no-store' });
                if (!response.ok) return;
                const payload = await response.json();
                fallbackPollMs = clampRange(payload.pollIntervalMs, 100, 30000, 1000);
                const next = {};
                SERVICE_CONFIG_FIELDS.forEach(function (f) {
                    const v = Number(payload[f.key]);
                    next[f.key] = Number.isFinite(v) ? v : SERVICE_CONFIG_DEFAULTS[f.key];
                });
                serviceConfig = next;
                serviceConfigLoaded = true;
            } catch (e) {
            }
        }

        async function fetchHealthStatus() {
            try {
                const response = await fetch(BASE_URL + '/health', { cache: 'no-store' });
                if (!response.ok) return null;
                const payload = await response.json();
                return payload && payload.status ? payload.status : null;
            } catch (e) {
                return null;
            }
        }

        function closeWebSocket() {
            if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
            if (ws) { ws.onopen = ws.onmessage = ws.onclose = ws.onerror = null; ws.close(); ws = null; }
        }

        function scheduleWsReconnect() {
            wsReconnectTimer = setTimeout(function () {
                wsReconnectTimer = null;
                connectWebSocket();
            }, wsBackoffMs);
            wsBackoffMs = Math.min(wsBackoffMs * 2, 16000);
        }

        function connectWebSocket() {
            closeWebSocket();
            lastAppliedPollMs = -1;
            const wsUrl = BASE_URL.replace(/^http/, 'ws') + '/ws';
            ws = new WebSocket(wsUrl);

            ws.onopen = async function () {
                wsBackoffMs = 1000;
                await postPollConfigIfNeeded();
                try {
                    const r = await fetch(BASE_URL + '/sensors', { cache: 'no-store', headers: { Accept: 'application/json' } });
                    if (r.ok) {
                        const payload = await r.json();
                        latestData = normalizeSensors(payload);
                        latestTimestamp = latestData ? latestData.timestamp : null;
                        setState('content', '');
                    }
                } catch (e) { }
            };

            ws.onmessage = function (event) {
                try {
                    const payload = JSON.parse(event.data);
                    latestData = normalizeSensors(payload);
                    latestTimestamp = latestData ? latestData.timestamp : null;
                    if (serviceRestarting) {
                        serviceRestarting = false;
                        var btn = document.getElementById('restart-service-btn');
                        if (btn) { btn.textContent = 'Restart service'; btn.disabled = false; }
                    }
                    setState('content', '');
                } catch (e) {
                    console.error('[AstralMonitor] WS parse error:', e && e.message ? e.message : String(e));
                }
            };

            ws.onclose = async function () {
                ws = null;
                latestData = null;
                latestTimestamp = null;
                const health = await fetchHealthStatus();
                if (health === 'no_device' || health === 'ok') {
                    setState('error', 'Background service is running, but no ASUS ROG Astral GPU was detected');
                } else {
                    setState('error', 'GPU sensors service is not running. Ensure the service is installed to proceed');
                }
                scheduleWsReconnect();
            };

            ws.onerror = function () {
            };
        }

        async function onIcueDataUpdated() {
            invalidatePropCache();
            pinsSettingsDirty = true;
            statusSettingsDirty = true;
            applyStyles();

            const configuredView = getIcueProperty('viewMode');
            if (configuredView === 'pins' || configuredView === 'status') {
                currentView = configuredView;
            }

            await postPollConfigIfNeeded();

            const debug = getIcueProperty('debugMode');
            if (debug === 'demo' || debug === 'overcurrent' || debug === 'imbalance' || debug === 'ocimb') {
                closeWebSocket();
                var warnFields = {};
                if (debug === 'overcurrent' || debug === 'ocimb') warnFields.wireOvercurrent = DEBUG_OVERCURRENT;
                if (debug === 'imbalance' || debug === 'ocimb') warnFields.currentImbalance = DEBUG_IMBALANCE;
                latestData = Object.assign({}, DEBUG_DATA, warnFields, { timestamp: new Date().toISOString() });
                latestTimestamp = latestData.timestamp;
                setState('content', '');
                return;
            }
            if (debug === 'error') {
                closeWebSocket();
                latestData = null;
                latestTimestamp = null;
                setState('error', 'GPU sensors service is not running. Ensure the service is installed to proceed');
                return;
            }

            if (!ws || ws.readyState === WebSocket.CLOSED || ws.readyState === WebSocket.CLOSING) {
                if (!wsReconnectTimer) connectWebSocket();
            }

            renderAll();
        }

        async function onIcueInitialized() {
            setState('loading', 'Loading');
            await fetchServiceConfig();
            await onIcueDataUpdated();
        }

        if (typeof iCUE_initialized !== 'undefined' && iCUE_initialized) {
            onIcueInitialized();
        } else {
            setState('loading', 'Loading');
            onIcueDataUpdated();
        }

        window.addEventListener('resize', function () {
            pinsSettingsDirty = true;
            statusSettingsDirty = true;
            lastActivateKey = '';
            renderAll();
        });

        (function () {
            var lastTapTime = 0;
            var lpTimer = null;
            var startX = 0;
            var startY = 0;
            var root = document.querySelector('.widget-root');
            if (!root) return;

            var confirmBtn = document.getElementById('cfg-confirm-btn');
            if (confirmBtn) confirmBtn.addEventListener('click', function () { submitConfig(); closeConfigPage(); });

            var cancelBtn = document.getElementById('cfg-cancel-btn');
            if (cancelBtn) cancelBtn.addEventListener('click', function () { closeConfigPage(); });

            var refreshBtn = document.getElementById('cfg-refresh-btn');
            if (refreshBtn) refreshBtn.addEventListener('click', async function () {
                refreshBtn.disabled = true;
                await fetchServiceConfig();
                if (configPageOpen) renderConfigPage();
                refreshBtn.disabled = false;
            });

            root.addEventListener('click', function (e) {
                if (getIcueProperty('configShortcut') === 'long-press') return;
                if (e.target.closest('button')) return;
                var now = Date.now();
                if (now - lastTapTime < 350) {
                    lastTapTime = 0;
                    if (configPageOpen) closeConfigPage();
                    else openConfigPage();
                } else {
                    lastTapTime = now;
                }
            });

            root.addEventListener('pointerdown', function (e) {
                if (getIcueProperty('configShortcut') !== 'long-press') return;
                if (e.target.closest('button')) return;
                startX = e.clientX;
                startY = e.clientY;
                lpTimer = setTimeout(function () {
                    lpTimer = null;
                    if (configPageOpen) closeConfigPage();
                    else openConfigPage();
                }, 500);
            });

            function cancelLp() {
                if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
            }

            root.addEventListener('pointerup', cancelLp);
            root.addEventListener('pointercancel', cancelLp);
            root.addEventListener('pointermove', function (e) {
                if (!lpTimer) return;
                var dx = e.clientX - startX;
                var dy = e.clientY - startY;
                if (dx * dx + dy * dy > 100) cancelLp();
            });
        }());
    </script>
</body>
